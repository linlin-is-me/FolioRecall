<path d="M350 474V522" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350 604V660" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350 742V818" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M630 701H704" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M840 742V818" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M704 859H630" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M350 900V950" fill="none" stroke="#52796b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="450" y="784" font-size="17" fill="#526b60">No rework</text>
<text x="802" y="640" font-size="17" fill="#526b60">At most one rework</text>
<text x="824" y="302" font-size="17" fill="#526b60">Up to two concurrent calls</text>
<text x="824" y="332" font-size="17" fill="#526b60">Wait for dependencies</text>
</g></svg>
