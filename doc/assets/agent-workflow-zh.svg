<text x="350.0" y="196.0" font-size="20" font-weight="400">提取要求、分配责任与前置依赖</text>
<rect x="40" y="270" width="290" height="86" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="185.0" y="305.3" font-size="18" font-weight="600">取证 A</text>
<text x="185.0" y="333.3" font-size="18" font-weight="400">第一组责任</text>
<rect x="370" y="270" width="290" height="86" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="515.0" y="305.3" font-size="18" font-weight="600">取证 B</text>
<text x="515.0" y="333.3" font-size="18" font-weight="400">另一组责任，按依赖调度</text>
<rect x="70" y="410" width="560" height="64" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="350.0" y="449.0" font-size="20" font-weight="600">共享原页与带范围的候选事实</text>
<rect x="70" y="522" width="560" height="82" rx="12" fill="#edf7f2" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="350.0" y="556.0" font-size="20" font-weight="600">分析</text>
<text x="350.0" y="584.0" font-size="20" font-weight="400">比较、计算与答案草稿</text>
<rect x="70" y="660" width="560" height="82" rx="12" fill="#edf7f2" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="350.0" y="694.0" font-size="20" font-weight="600">核验</text>
<text x="350.0" y="722.0" font-size="20" font-weight="400">对照原页检查声明、遗漏与条件</text>
<rect x="704" y="660" width="272" height="82" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="840.0" y="693.3" font-size="18" font-weight="600">定向返工</text>
<text x="840.0" y="721.3" font-size="18" font-weight="400">原责任取证或分析修订</text>
<rect x="704" y="818" width="272" height="82" rx="12" fill="#edf7f2" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="840.0" y="865.3" font-size="18" font-weight="600">末次核验</text>
<rect x="70" y="818" width="560" height="82" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="350.0" y="852.0" font-size="20" font-weight="600">保留模型核验支持的声明</text>
<text x="350.0" y="880.0" font-size="20" font-weight="400">单列模型报告的未解决事项</text>
<rect x="70" y="950" width="560" height="64" rx="12" fill="#f8faf9" stroke="#9bb8aa" stroke-width="1.5"/>
<text x="350.0" y="989.0" font-size="20" font-weight="600">保存答案、引用、轨迹与费用</text>
