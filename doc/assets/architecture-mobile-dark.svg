<text x="74" y="752" font-size="14" fill="#65c9bd" font-weight="700" letter-spacing="1.2">ONLINE · QUERY THE INDEX</text>
<text x="34" y="786" font-size="15" fill="#a3b3c5" font-weight="400">At startup: check teacher / index identity.</text>
<rect x="34" y="810" width="372" height="76" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="830" width="46" height="46" rx="12" fill="#173432" stroke="#173432"/>
