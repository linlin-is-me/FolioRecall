<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1376" viewBox="0 0 440 1376" role="img" aria-labelledby="title description">
<title id="title">FolioRecall page retrieval architecture</title>
<desc id="description">Offline: import PDF or page images, encode them with Qwen3-VL and save a page index with metadata. Previews stay in separate files. Online: encode an English query with NanoVDR ML, search the saved index using CPU FAISS and return ranked pages and JSON. Gradio reads preview files for display. Check teacher and index identity before loading the query model.</desc>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#233142"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 8 5 0 9" fill="none" stroke="#8096ae" stroke-width="1.5"/></marker>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif} .wire{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} .icon{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="440" height="1376" rx="24" fill="#101923"/>
<rect width="440" height="1376" rx="24" fill="url(#dots)"/>
<text x="24" y="40" font-size="13" fill="#a3b3c5" font-weight="700" letter-spacing="2">FOLIORECALL</text>
<text x="24" y="78" font-size="25" fill="#edf3fa" font-weight="650">Page retrieval architecture</text>
<text x="24" y="106" font-size="16" fill="#a3b3c5" font-weight="400">Original teacher + public ML student</text>
<rect x="16" y="136" width="408" height="540" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="34" y="158" width="28" height="28" rx="9" fill="#26243d" stroke="#26243d"/>
