<text x="74" y="178" font-size="14" fill="#b1a0f1" font-weight="700" letter-spacing="1.2">OFFLINE · BUILD THE INDEX</text>
<rect x="34" y="210" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="230" width="46" height="46" rx="12" fill="#26243d" stroke="#26243d"/>
<g class="icon" transform="translate(57,237)" stroke="#b1a0f1"><path d="M7 3h12l6 6v23H7z M19 3v7h6 M12 16h8 M12 22h8 M12 27h5"/></g>
<text x="112" y="241" font-size="21" fill="#edf3fa" font-weight="600">Document import</text>
<text x="112" y="267" font-size="15" fill="#a3b3c5" font-weight="400">PDF / images → pages</text>
<text x="112" y="290" font-size="15" fill="#a3b3c5" font-weight="400">Save metadata + preview files</text>
<rect x="34" y="348" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="368" width="46" height="46" rx="12" fill="#26243d" stroke="#26243d"/>
<g class="icon" transform="translate(57,375)" stroke="#b1a0f1"><rect x="7" y="7" width="20" height="20" rx="4"/><path d="M13 13h8v8h-8z M12 2v5 M22 2v5 M12 27v5 M22 27v5 M2 12h5 M2 22h5 M27 12h5 M27 22h5"/></g>
<text x="112" y="379" font-size="21" fill="#edf3fa" font-weight="600">Page teacher</text>
<text x="112" y="405" font-size="15" fill="#a3b3c5" font-weight="400">Qwen3-VL-Embedding-2B</text>
<text x="112" y="428" font-size="15" fill="#a3b3c5" font-weight="400">GPU BF16 · 2048-D vectors</text>
<rect x="34" y="486" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="506" width="46" height="46" rx="12" fill="#1d3046" stroke="#1d3046"/>
<g class="icon" transform="translate(57,513)" stroke="#88b7e9"><ellipse cx="17" cy="7" rx="12" ry="5"/><path d="M5 7v19c0 7 24 7 24 0V7 M5 16c0 7 24 7 24 0"/></g>
<text x="112" y="517" font-size="21" fill="#edf3fa" font-weight="600">Page index</text>
<text x="112" y="543" font-size="15" fill="#a3b3c5" font-weight="400">FAISS vectors + metadata</text>
<text x="112" y="566" font-size="15" fill="#a3b3c5" font-weight="400">Saved with encoder identity</text>
<path class="wire" d="M220 307 V344" stroke="#8096ae" marker-end="url(#arrow)"/>
<path class="wire" d="M220 445 V482" stroke="#8096ae" marker-end="url(#arrow)"/>
