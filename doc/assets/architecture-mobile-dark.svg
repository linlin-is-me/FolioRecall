<text x="112" y="841" font-size="21" fill="#edf3fa" font-weight="600">English query</text>
<text x="112" y="867" font-size="15" fill="#a3b3c5" font-weight="400">Raw text · no teacher prompt</text>
<rect x="34" y="924" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="944" width="46" height="46" rx="12" fill="#173432" stroke="#173432"/>
<g class="icon" transform="translate(57,951)" stroke="#65c9bd"><rect x="7" y="7" width="20" height="20" rx="4"/><path d="M13 13h8v8h-8z M12 2v5 M22 2v5 M12 27v5 M22 27v5 M2 12h5 M2 22h5 M27 12h5 M27 22h5"/></g>
<text x="112" y="955" font-size="21" fill="#edf3fa" font-weight="600">Query student</text>
<text x="112" y="981" font-size="15" fill="#a3b3c5" font-weight="400">NanoVDR ML · GPU BF16</text>
<text x="112" y="1004" font-size="15" fill="#a3b3c5" font-weight="400">CPU FP32 also supported</text>
<rect x="34" y="1058" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="1078" width="46" height="46" rx="12" fill="#173432" stroke="#173432"/>
<g class="icon" transform="translate(57,1085)" stroke="#65c9bd"><circle cx="14" cy="14" r="10"/><path d="m22 22 10 10 M10 14h8 M14 10v8"/></g>
<text x="112" y="1089" font-size="21" fill="#edf3fa" font-weight="600">Similarity search</text>
<text x="112" y="1115" font-size="15" fill="#a3b3c5" font-weight="400">FAISS IndexFlatIP · CPU</text>
<text x="112" y="1138" font-size="15" fill="#a3b3c5" font-weight="400">Uses the saved page index</text>
<rect x="34" y="1192" width="372" height="96" rx="16" fill="#172330" stroke="#2e4155"/>
<rect x="50" y="1212" width="46" height="46" rx="12" fill="#173432" stroke="#173432"/>
<g class="icon" transform="translate(57,1219)" stroke="#65c9bd"><rect x="3" y="4" width="28" height="26" rx="4"/><path d="M3 12h28 M12 12v18 M18 19h8 M18 24h6"/></g>
<text x="112" y="1223" font-size="21" fill="#edf3fa" font-weight="600">Ranked pages</text>
<text x="112" y="1249" font-size="15" fill="#a3b3c5" font-weight="400">Sources · page numbers · JSON</text>
<text x="112" y="1272" font-size="15" fill="#a3b3c5" font-weight="400">Gradio reads preview files</text>
<path class="wire" d="M220 887 V920" stroke="#8096ae" marker-end="url(#arrow)"/>
<path class="wire" d="M220 1021 V1054" stroke="#8096ae" marker-end="url(#arrow)"/>
<path class="wire" d="M220 1155 V1188" stroke="#8096ae" marker-end="url(#arrow)"/>
<text x="34" y="1354" font-size="16" fill="#a3b3c5" font-weight="400">CLI + Gradio share retrieve()</text>
</svg>
