<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="856" viewBox="0 0 1040 856" role="img" aria-labelledby="title description">
<title id="title">FolioRecall page retrieval architecture</title>
<desc id="description">Offline: import PDF or page images, encode them with Qwen3-VL and save a page index with metadata. Previews stay in separate files. Online: encode an English query with NanoVDR ML, search the saved index using CPU FAISS and return ranked pages and JSON. Gradio reads preview files for display. Check teacher and index identity before loading the query model.</desc>
