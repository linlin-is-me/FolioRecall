<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FolioRecall · 人工复核</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172c35;background:#f4f6f4}body{margin:0}header{background:#163d42;color:white;padding:22px 4vw}h1{font-size:25px;margin:0 0 10px}main{max-width:1400px;margin:auto;padding:20px}button,select,input{font:inherit;padding:8px;border:1px solid #aebcb9;border-radius:5px}button{cursor:pointer;background:white}button:hover{background:#e1eeee}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.question{padding:20px;background:#fff;border-radius:10px;margin:18px 0}h2{font-size:21px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #cbd6d3;border-radius:10px;padding:18px;overflow-wrap:anywhere}h3{color:#215b61}.claim{border-bottom:1px solid #dfe5e1;padding:12px 0}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;margin:8px 0}textarea{box-sizing:border-box;width:100%;min-height:55px;border:1px solid #b8c8c2;border-radius:5px;font:inherit;padding:8px}a{color:#17616b}.refs{border-top:1px solid #ccd8d0;margin-top:15px;padding-top:10px}.pages{display:flex;gap:8px;flex-wrap:wrap}dialog{width:min(1100px,90vw);max-height:90vh;border:0;border-radius:10px}dialog img{max-width:100%}.muted{color:#5b6e71;font-size:14px}.confirmed{border-color:#2b8c6b}.notice{min-height:24px;color:#245c47}@media(max-width:950px){.cards{grid-template-columns:1fr}}
</style></head><body>
<header><h1>FolioRecall · 人工复核</h1><div>10题 · 30份匿名回答。请依据原页判断，回答正确与引用合法分别核验。</div></header>
<main><div class="toolbar"><button id="previous">上一题</button><select id="task"></select><button id="next">下一题</button><span id="progress"></span><button id="export">导出JSON</button><button id="import">导入JSON</button><input type="file" id="file" accept="application/json" hidden></div>
<p class="muted">0＝不满足，0.5＝部分满足，1＝满足。留空或待确认会保留为草稿；每份回答须勾选确认。进度自动保存在本浏览器，离开前请导出JSON。原页按钮可放大查看。</p>
<div id="notice" class="notice" role="status"></div><div id="content"></div></main>
<dialog id="page"><button id="close">关闭原页</button><h3 id="caption"></h3><img id="image" alt="原始页面预览"></dialog>
<script>
const DATA=/*__DATA__*/;
const KEY='foliorecall-a6-'+DATA.bundle_id;
const ids=new Map(DATA.tasks.flatMap(t=>t.answers.map(a=>[a.id,a])));
let state={bundle_id:DATA.bundle_id,reviews:[]}, current=0;
try{const saved=localStorage.getItem(KEY);if(saved)state=JSON.parse(saved)}catch(e){document.getElementById('notice').textContent='浏览器存储不可用，请使用JSON导出保存。'}
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const get=(a,t)=>{let r=state.reviews.find(r=>r.id===a.id);if(!r){r={id:a.id,answer_digest:a.answer_digest,claims:a.answer.claims.map(()=>({fact:null,citation:null,notes:''})),facts:t.reference_facts.map(()=>({score:null,notes:''})),insufficiency:null,language_ok:null,confirmed:false,notes:''};state.reviews.push(r)}return r};
function complete(r,a,t){return r.confirmed===true&&typeof r.language_ok==='boolean'&&[0,.5,1].includes(r.insufficiency)&&r.claims.every(x=>[0,.5,1].includes(x.fact)&&[0,.5,1].includes(x.citation))&&(!a.answer.claims.length||r.facts.every(x=>[0,.5,1].includes(x.score)))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById('notice').textContent='无法自动保存，请立即导出JSON。'}let count=0;for(const t of DATA.tasks)for(const a of t.answers){const r=state.reviews.find(x=>x.id===a.id);if(r&&complete(r,a,t))count++}document.getElementById('progress').textContent='已确认 '+count+'/30';for(const c of document.querySelectorAll('input[data-review-id]'))c.checked=state.reviews.find(r=>r.id===c.dataset.reviewId)?.confirmed===true;}
function score(title,value,set){const label=el('label',title+' '),s=el('select');for(const [v,text]of [['','未填写'],['pending','待确认'],['0','0 · 不满足'],['0.5','0.5 · 部分满足'],['1','1 · 满足']]){const o=el('option',text);o.value=v;s.append(o)}s.value=value===null?'':String(value);s.onchange=()=>{set(s.value===''?null:s.value==='pending'?'pending':Number(s.value));save()};label.append(s);return label}
function notes(value,set,placeholder){const n=el('textarea');n.value=value||'';n.placeholder=placeholder;n.oninput=()=>{set(n.value);save()};return n}
function pageButton(p){const b=el('button',p.document+' · 物理第'+p.number+'页');b.onclick=()=>{document.getElementById('caption').textContent=b.textContent;document.getElementById('image').src=p.image;document.getElementById('page').showModal()};return b}
function render(){const t=DATA.tasks[current],content=document.getElementById('content');content.replaceChildren();document.getElementById('task').value=String(current);const q=el('section');q.className='question';q.append(el('h2','第'+t.order+'题 · '+(t.language==='zh'?'中文':'English')),el('p',t.question));const ref=el('details');ref.append(el('summary','冻结参考事实与原页'));const list=el('ol');for(const f of t.reference_facts)list.append(el('li',f));if(!t.reference_facts.length)ref.append(el('p','本题没有必需事实，覆盖度不适用。'));ref.append(list);const ps=el('div');ps.className='pages';for(const p of t.pages)ps.append(pageButton(p));ref.append(ps);q.append(ref);content.append(q);const cards=el('div');cards.className='cards';for(const a of t.answers){const r=get(a,t),card=el('article');card.className='card';card.append(el('h3','匿名回答 '+a.id));a.answer.claims.forEach((c,i)=>{const box=el('div');box.className='claim';box.append(el('p',c.text));for(const pid of c.evidence_page_ids){const p=t.pages.find(x=>x.id===pid);if(p)box.append(pageButton(p))}const sc=el('div');sc.className='scores';sc.append(score('事实正确性',r.claims[i].fact,v=>{r.claims[i].fact=v;r.confirmed=false}),score('引用支持',r.claims[i].citation,v=>{r.claims[i].citation=v;r.confirmed=false}));box.append(sc,notes(r.claims[i].notes,v=>r.claims[i].notes=v,'简述不满足或部分满足的原因'));card.append(box)});for(const u of a.answer.unresolved)card.append(el('p',u));if(!a.answer.claims.length)card.append(el('p','没有事实声明：事实正确性和引用支持不适用。'));const refs=el('div');refs.className='refs';refs.append(el('h4','必需事实覆盖'));t.reference_facts.forEach((f,i)=>{refs.append(el('p',f));if(a.answer.claims.length)refs.append(score('覆盖情况',r.facts[i].score,v=>{r.facts[i].score=v;r.confirmed=false}),notes(r.facts[i].notes,v=>r.facts[i].notes=v,'覆盖判断说明'));else{r.facts[i].score=0;refs.append(el('p','空答覆盖度为0。'))}});if(!t.reference_facts.length)refs.append(el('p','覆盖度不适用。'));refs.append(score('不足处理',r.insufficiency,v=>{r.insufficiency=v;r.confirmed=false}));const language=el('label','回答语言符合题目要求 '),select=el('select');for(const [v,text]of [['','未填写'],['true','是'],['false','否']]){const o=el('option',text);o.value=v;select.append(o)}select.value=r.language_ok===null?'':String(r.language_ok);select.onchange=()=>{r.language_ok=select.value===''?null:select.value==='true';r.confirmed=false;save()};language.append(select);refs.append(language,notes(r.notes,v=>r.notes=v,'整份回答的诊断或分歧'));const confirm=el('label'),check=el('input');check.type='checkbox';check.dataset.reviewId=a.id;check.checked=r.confirmed;check.onchange=()=>{r.confirmed=check.checked;save()};confirm.append(check,document.createTextNode(' 已核对原页，确认本份评分'));refs.append(confirm);card.append(refs);cards.append(card)}content.append(cards);save()}
DATA.tasks.forEach((t,i)=>{const o=el('option','第'+t.order+'题 · '+t.task_id);o.value=String(i);document.getElementById('task').append(o)});
document.getElementById('task').onchange=e=>{current=Number(e.target.value);render()};document.getElementById('previous').onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById('next').onclick=()=>{current=Math.min(DATA.tasks.length-1,current+1);render()};document.getElementById('close').onclick=()=>document.getElementById('page').close();
document.getElementById('export').onclick=()=>{save();const data={...state,exported_at:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='a6-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.bundle_id!==DATA.bundle_id||!Array.isArray(x.reviews))throw Error('文件不属于本次材料');const seen=new Set();for(const r of x.reviews){const a=ids.get(r.id);if(!a||seen.has(r.id)||r.answer_digest!==a.answer_digest||!Array.isArray(r.claims)||r.claims.length!==a.answer.claims.length||!Array.isArray(r.facts)||r.facts.length!==DATA.tasks.find(t=>t.answers.some(x=>x.id===r.id)).reference_facts.length)throw Error('编号、答案绑定或评分数量错误');seen.add(r.id)}state=x;render();document.getElementById('notice').textContent='已导入，原有浏览器进度已替换为该文件。'}catch(e){document.getElementById('notice').textContent='导入失败：'+e.message}e.target.value=''};
render();
</script></body></html>
