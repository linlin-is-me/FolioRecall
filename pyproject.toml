[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foliorecall"
version = "0.1.0rc1"
description = "Page-level visual document retrieval with independent query students"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "FolioRecall contributors"}]
dependencies = [
  "torch==2.8.0", "sentence-transformers==6.0.1", "transformers==5.16.1",
  "numpy==2.2.6", "pillow==12.3.0", "faiss-cpu==1.15.0",
  "huggingface-hub==1.30.0",
]

[project.optional-dependencies]
demo = ["gradio==6.27.0"]
image = ["torchvision==0.23.0", "pypdfium2==5.13.0"]
train = ["accelerate==1.14.0", "peft==0.20.0", "datasets==5.0.1"]
eval = ["pyarrow==25.0.1", "rank-bm25==0.2.2", "pytrec-eval-terrier==0.5.10"]

[project.scripts]
foliorecall = "foliorecall.__main__:entrypoint"

[project.urls]
Repository = "https://github.com/linlin-is-me/FolioRecall"

[tool.setuptools]
packages = ["foliorecall"]
